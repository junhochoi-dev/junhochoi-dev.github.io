---
layout: default
---

<div class="page-banner">
<h1 class="page-banner-title">{{ page.title | escape }}</h1>
<p class="page-banner-desc">암호화된 비공개 메모 공간</p>
</div>

<div id="vault-lock" class="vault-box">
  <p class="vault-desc">🔒 이 공간의 게시물은 암호화되어 있습니다. 비밀번호를 입력해 주세요.</p>
  <form id="vault-form" class="vault-form">
    <input
      type="password"
      id="vault-password"
      placeholder="비밀번호 입력"
      autocomplete="current-password"
      required
    />
    <button type="submit" id="vault-submit">잠금 해제</button>
  </form>
  <p id="vault-error" class="vault-error" hidden>비밀번호가 올바르지 않습니다.</p>
</div>

<div id="vault-unlocked" hidden>
  <div class="vault-toolbar">
    <div id="vault-breadcrumb" class="vault-breadcrumb"></div>
    <button type="button" id="vault-relock" class="vault-relock-btn">다시 잠그기</button>
  </div>
  <div id="vault-view"></div>
</div>

<script id="vault-payload" type="text/plain">{{ page.encrypted_payload }}</script>

<style>
  .vault-box {
    max-width: 440px;
    margin: 2.5rem auto;
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
    text-align: center;
  }
  .vault-desc {
    margin-bottom: 1.25rem;
    color: #262626;
    font-size: 0.95rem;
  }
  .vault-form {
    display: flex;
    gap: 0.5rem;
  }
  .vault-form input {
    flex: 1;
    padding: 0.6rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    font-size: 0.95rem;
    background: #ffffff;
    color: #0a0a0a;
  }
  .vault-form button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-form button:hover {
    background: #262626;
  }
  .vault-error {
    margin-top: 0.85rem;
    margin-bottom: 0;
    color: #0a0a0a;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .vault-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid #e5e5e5;
  }
  .vault-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.92rem;
    color: #737373;
  }
  .vault-crumb-btn {
    padding: 0.25rem 0.6rem;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #0a0a0a;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
  }
  .vault-crumb-btn:hover {
    background: #f5f5f5;
  }
  .vault-crumb-current {
    font-weight: 700;
    color: #0a0a0a;
  }
  .vault-relock-btn {
    padding: 0.4rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    background: #ffffff;
    color: #0a0a0a;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-relock-btn:hover {
    background: #f5f5f5;
    border-color: #0a0a0a;
  }
  .vault-folder-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
  .vault-folder-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #ffffff;
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vault-folder-card:hover {
    transform: translateY(-2px);
    border-color: #0a0a0a;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
  }
  .vault-folder-icon {
    font-size: 1.6rem;
    margin-bottom: 0.6rem;
  }
  .vault-folder-name {
    margin: 0 0 0.3rem 0;
    font-size: 1.12rem;
    font-weight: 700;
    color: #0a0a0a;
  }
  .vault-folder-count {
    font-size: 0.86rem;
    color: #737373;
    font-weight: 600;
  }
  .vault-post-list {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .vault-post-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    padding: 1.2rem 1.4rem;
    border: 1px solid #e5e5e5;
    border-left: 4px solid #0a0a0a;
    border-radius: 10px;
    background: #ffffff;
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vault-post-row:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
  }
  .vault-post-row-title {
    margin: 0 0 0.35rem 0;
    font-size: 1.1rem;
    font-weight: 700;
    color: #0a0a0a;
  }
  .vault-post-row-date {
    font-size: 0.85rem;
    color: #737373;
    white-space: nowrap;
  }
  .vault-back-btn {
    display: inline-block;
    margin-bottom: 1rem;
    padding: 0.4rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    background: #ffffff;
    color: #0a0a0a;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-back-btn:hover {
    background: #f5f5f5;
    border-color: #0a0a0a;
  }
  .vault-detail-card {
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-left: 4px solid #0a0a0a;
    border-radius: 10px;
    background: #ffffff;
  }
  .vault-card-cat {
    display: inline-block;
    margin-bottom: 0.6rem;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .vault-card-title {
    margin: 0 0 0.45rem 0;
    font-size: 1.45rem;
    font-weight: 800;
    color: #0a0a0a;
  }
  .vault-card-meta {
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #f5f5f5;
    font-size: 0.86rem;
    color: #737373;
  }
  .vault-tag {
    display: inline-block;
    margin-right: 0.35rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    color: #262626;
    font-size: 0.78rem;
    font-weight: 600;
  }
  @media (max-width: 768px) {
    .vault-folder-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
(function () {
  const lockBox = document.getElementById('vault-lock');
  const unlockedBox = document.getElementById('vault-unlocked');
  const form = document.getElementById('vault-form');
  const pwInput = document.getElementById('vault-password');
  const errorEl = document.getElementById('vault-error');
  const breadcrumbEl = document.getElementById('vault-breadcrumb');
  const viewEl = document.getElementById('vault-view');
  const relockBtn = document.getElementById('vault-relock');
  const payloadB64 = document.getElementById('vault-payload').textContent.trim();

  let allPosts = [];
  let selectedCategory = null; // null -> folder list view
  let selectedPostId = null;   // null -> post list view

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  async function decryptPayload(password) {
    const raw = b64ToBytes(payloadB64);
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const dataWithTag = raw.slice(28);

    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const key = await window.crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decrypted = await window.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      dataWithTag
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = '';

    const rootBtn = document.createElement('button');
    rootBtn.type = 'button';
    rootBtn.className = 'vault-crumb-btn';
    rootBtn.textContent = '🔓 Vault';
    rootBtn.addEventListener('click', function () {
      selectedCategory = null;
      selectedPostId = null;
      render();
    });
    breadcrumbEl.appendChild(rootBtn);

    if (selectedCategory) {
      const sep1 = document.createElement('span');
      sep1.textContent = '/';
      breadcrumbEl.appendChild(sep1);

      if (selectedPostId) {
        const catBtn = document.createElement('button');
        catBtn.type = 'button';
        catBtn.className = 'vault-crumb-btn';
        catBtn.textContent = selectedCategory;
        catBtn.addEventListener('click', function () {
          selectedPostId = null;
          render();
        });
        breadcrumbEl.appendChild(catBtn);

        const sep2 = document.createElement('span');
        sep2.textContent = '/';
        breadcrumbEl.appendChild(sep2);

        const post = allPosts.find(function (p) { return p.id === selectedPostId; });
        const cur = document.createElement('span');
        cur.className = 'vault-crumb-current';
        cur.textContent = post ? post.title : '';
        breadcrumbEl.appendChild(cur);
      } else {
        const catCur = document.createElement('span');
        catCur.className = 'vault-crumb-current';
        catCur.textContent = selectedCategory;
        breadcrumbEl.appendChild(catCur);
      }
    }
  }

  function renderFolders() {
    const counts = {};
    const categories = [];
    allPosts.forEach(function (post) {
      const cat = post.category || 'General';
      if (!counts[cat]) {
        counts[cat] = 0;
        categories.push(cat);
      }
      counts[cat] += 1;
    });

    const grid = document.createElement('div');
    grid.className = 'vault-folder-grid';

    categories.forEach(function (cat) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'vault-folder-card';
      card.addEventListener('click', function () {
        selectedCategory = cat;
        selectedPostId = null;
        render();
      });

      const icon = document.createElement('div');
      icon.className = 'vault-folder-icon';
      icon.textContent = '📁';
      card.appendChild(icon);

      const name = document.createElement('h2');
      name.className = 'vault-folder-name';
      name.textContent = cat;
      card.appendChild(name);

      const count = document.createElement('div');
      count.className = 'vault-folder-count';
      count.textContent = counts[cat] + '개의 게시물 →';
      card.appendChild(count);

      grid.appendChild(card);
    });

    viewEl.appendChild(grid);
  }

  function renderPostList() {
    const backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'vault-back-btn';
    backBtn.textContent = '← 폴더 목록으로';
    backBtn.addEventListener('click', function () {
      selectedCategory = null;
      selectedPostId = null;
      render();
    });
    viewEl.appendChild(backBtn);

    const list = document.createElement('div');
    list.className = 'vault-post-list';

    const filtered = allPosts.filter(function (p) {
      return (p.category || 'General') === selectedCategory;
    });

    filtered.forEach(function (post) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'vault-post-row';
      row.addEventListener('click', function () {
        selectedPostId = post.id;
        render();
      });

      const left = document.createElement('div');
      const title = document.createElement('h3');
      title.className = 'vault-post-row-title';
      title.textContent = post.title;
      left.appendChild(title);

      if (Array.isArray(post.tags)) {
        post.tags.forEach(function (tag) {
          const span = document.createElement('span');
          span.className = 'vault-tag';
          span.textContent = '#' + tag;
          left.appendChild(span);
        });
      }
      row.appendChild(left);

      const date = document.createElement('div');
      date.className = 'vault-post-row-date';
      date.textContent = (post.date || '') + ' →';
      row.appendChild(date);

      list.appendChild(row);
    });

    viewEl.appendChild(list);
  }

  function renderPostDetail() {
    const post = allPosts.find(function (p) { return p.id === selectedPostId; });
    if (!post) {
      selectedPostId = null;
      renderPostList();
      return;
    }

    const backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'vault-back-btn';
    backBtn.textContent = '← ' + selectedCategory + ' 목록으로';
    backBtn.addEventListener('click', function () {
      selectedPostId = null;
      render();
    });
    viewEl.appendChild(backBtn);

    const card = document.createElement('section');
    card.className = 'vault-detail-card';

    if (post.category) {
      const catBadge = document.createElement('span');
      catBadge.className = 'vault-card-cat';
      catBadge.textContent = post.category;
      card.appendChild(catBadge);
    }

    const title = document.createElement('h2');
    title.className = 'vault-card-title';
    title.textContent = post.title;
    card.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'vault-card-meta';
    const dateSpan = document.createElement('span');
    dateSpan.textContent = (post.date || '') + ' ';
    meta.appendChild(dateSpan);

    if (Array.isArray(post.tags)) {
      post.tags.forEach(function (tag) {
        const span = document.createElement('span');
        span.className = 'vault-tag';
        span.textContent = '#' + tag;
        meta.appendChild(span);
      });
    }
    card.appendChild(meta);

    const body = document.createElement('div');
    body.className = 'vault-card-body';
    body.innerHTML = post.content || '';
    card.appendChild(body);

    viewEl.appendChild(card);
  }

  function render() {
    renderBreadcrumb();
    viewEl.innerHTML = '';
    if (!selectedCategory) {
      renderFolders();
    } else if (!selectedPostId) {
      renderPostList();
    } else {
      renderPostDetail();
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    try {
      allPosts = await decryptPayload(pwInput.value);
      selectedCategory = null;
      selectedPostId = null;
      render();
      pwInput.value = '';
      lockBox.hidden = true;
      unlockedBox.hidden = false;
    } catch (err) {
      errorEl.hidden = false;
      pwInput.select();
    }
  });

  relockBtn.addEventListener('click', function () {
    allPosts = [];
    selectedCategory = null;
    selectedPostId = null;
    breadcrumbEl.innerHTML = '';
    viewEl.innerHTML = '';
    unlockedBox.hidden = true;
    lockBox.hidden = false;
    pwInput.value = '';
    pwInput.focus();
  });
})();
</script>
