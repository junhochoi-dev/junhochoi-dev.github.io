---
layout: default
---

<div class="page-banner">
<h1 class="page-banner-title">{{ page.title | escape }}</h1>
<p class="page-banner-desc">암호화된 비공개 메모 공간</p>
</div>

<div id="vault-lock" class="vault-box">
  <p class="vault-desc">🔒 이 공간의 게시물은 암호화되어 있습니다. 비밀번호를 입력해 주세요.</p>
  <form id="vault-form" class="vault-form">
    <input
      type="password"
      id="vault-password"
      placeholder="비밀번호 입력"
      autocomplete="current-password"
      required
    />
    <button type="submit" id="vault-submit">잠금 해제</button>
  </form>
  <p id="vault-error" class="vault-error" hidden>비밀번호가 올바르지 않습니다.</p>
</div>

<div id="vault-unlocked" hidden>
  <div class="vault-toolbar">
    <span class="vault-status">🔓 잠금 해제됨</span>
    <button type="button" id="vault-relock" class="vault-relock-btn">다시 잠그기</button>
  </div>
  <div id="vault-tabs" class="vault-tabs"></div>
  <div id="vault-posts" class="vault-posts"></div>
</div>

<script id="vault-payload" type="text/plain">{{ page.encrypted_payload }}</script>

<style>
  .vault-box {
    max-width: 440px;
    margin: 2.5rem auto;
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
    text-align: center;
  }
  .vault-desc {
    margin-bottom: 1.25rem;
    color: #262626;
    font-size: 0.95rem;
  }
  .vault-form {
    display: flex;
    gap: 0.5rem;
  }
  .vault-form input {
    flex: 1;
    padding: 0.6rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    font-size: 0.95rem;
    background: #ffffff;
    color: #0a0a0a;
  }
  .vault-form button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-form button:hover {
    background: #262626;
  }
  .vault-error {
    margin-top: 0.85rem;
    margin-bottom: 0;
    color: #0a0a0a;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .vault-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid #e5e5e5;
  }
  .vault-status {
    font-size: 0.9rem;
    color: #0a0a0a;
    font-weight: 700;
  }
  .vault-relock-btn {
    padding: 0.4rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    background: #ffffff;
    color: #0a0a0a;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-relock-btn:hover {
    background: #f5f5f5;
    border-color: #0a0a0a;
  }
  .vault-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin-bottom: 1.5rem;
  }
  .vault-tab-btn {
    padding: 0.45rem 0.95rem;
    border: 1px solid #e5e5e5;
    border-radius: 999px;
    background: #ffffff;
    color: #525252;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .vault-tab-btn:hover {
    border-color: #0a0a0a;
    color: #0a0a0a;
  }
  .vault-tab-btn.active {
    background: #0a0a0a;
    border-color: #0a0a0a;
    color: #ffffff;
  }
  .vault-card {
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    border: 1px solid #e5e5e5;
    border-left: 4px solid #0a0a0a;
    border-radius: 10px;
    background: #ffffff;
  }
  .vault-card-cat {
    display: inline-block;
    margin-bottom: 0.5rem;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .vault-card-title {
    margin: 0 0 0.35rem 0;
    font-size: 1.3rem;
    font-weight: 700;
    color: #0a0a0a;
  }
  .vault-card-meta {
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: #737373;
  }
  .vault-tag {
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    color: #262626;
    font-size: 0.78rem;
    font-weight: 600;
  }
</style>

<script>
(function () {
  const lockBox = document.getElementById('vault-lock');
  const unlockedBox = document.getElementById('vault-unlocked');
  const form = document.getElementById('vault-form');
  const pwInput = document.getElementById('vault-password');
  const errorEl = document.getElementById('vault-error');
  const tabsEl = document.getElementById('vault-tabs');
  const postsEl = document.getElementById('vault-posts');
  const relockBtn = document.getElementById('vault-relock');
  const payloadB64 = document.getElementById('vault-payload').textContent.trim();

  let allPosts = [];
  let activeCategory = 'All';

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  async function decryptPayload(password) {
    const raw = b64ToBytes(payloadB64);
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const dataWithTag = raw.slice(28);

    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const key = await window.crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decrypted = await window.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      dataWithTag
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    const counts = { All: allPosts.length };
    const categories = ['All'];

    allPosts.forEach(function (post) {
      const cat = post.category || 'General';
      if (!counts[cat]) {
        counts[cat] = 0;
        categories.push(cat);
      }
      counts[cat] += 1;
    });

    categories.forEach(function (cat) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'vault-tab-btn' + (activeCategory === cat ? ' active' : '');
      btn.textContent = cat + ' (' + counts[cat] + ')';
      btn.addEventListener('click', function () {
        activeCategory = cat;
        renderTabs();
        renderPosts();
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderPosts() {
    postsEl.innerHTML = '';
    const filtered = activeCategory === 'All'
      ? allPosts
      : allPosts.filter(function (p) { return (p.category || 'General') === activeCategory; });

    filtered.forEach(function (post) {
      const card = document.createElement('section');
      card.className = 'vault-card';

      if (post.category) {
        const catBadge = document.createElement('span');
        catBadge.className = 'vault-card-cat';
        catBadge.textContent = post.category;
        card.appendChild(catBadge);
      }

      const title = document.createElement('h2');
      title.className = 'vault-card-title';
      title.textContent = post.title;
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'vault-card-meta';
      meta.textContent = post.date || '';
      if (Array.isArray(post.tags)) {
        post.tags.forEach(function (tag) {
          const span = document.createElement('span');
          span.className = 'vault-tag';
          span.textContent = '#' + tag;
          meta.appendChild(span);
        });
      }
      card.appendChild(meta);

      const body = document.createElement('div');
      body.className = 'vault-card-body';
      body.innerHTML = post.content || '';
      card.appendChild(body);

      postsEl.appendChild(card);
    });
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    try {
      allPosts = await decryptPayload(pwInput.value);
      activeCategory = 'All';
      renderTabs();
      renderPosts();
      pwInput.value = '';
      lockBox.hidden = true;
      unlockedBox.hidden = false;
    } catch (err) {
      errorEl.hidden = false;
      pwInput.select();
    }
  });

  relockBtn.addEventListener('click', function () {
    allPosts = [];
    tabsEl.innerHTML = '';
    postsEl.innerHTML = '';
    unlockedBox.hidden = true;
    lockBox.hidden = false;
    pwInput.value = '';
    pwInput.focus();
  });
})();
</script>
