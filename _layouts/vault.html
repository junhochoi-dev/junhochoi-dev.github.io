---
layout: default
---

<div class="page-banner">
<h1 class="page-banner-title">{{ page.title | escape }}</h1>
<p class="page-banner-desc">암호화된 비공개 메모 &amp; 자격증 정리 공간</p>
</div>

<div id="vault-lock" class="vault-box">
  <p class="vault-desc">🔒 이 공간의 게시물은 암호화되어 있습니다. 비밀번호를 입력해 주세요.</p>
  <form id="vault-form" class="vault-form">
    <input
      type="password"
      id="vault-password"
      placeholder="비밀번호 입력"
      autocomplete="current-password"
      required
    />
    <button type="submit" id="vault-submit">잠금 해제</button>
  </form>
  <p id="vault-error" class="vault-error" hidden>비밀번호가 올바르지 않습니다.</p>
</div>

<div id="vault-unlocked" hidden>
  <div class="vault-toolbar">
    <div id="vault-breadcrumb" class="vault-breadcrumb"></div>
    <button type="button" id="vault-relock" class="vault-relock-btn">다시 잠그기</button>
  </div>
  <div class="vault-layout">
    <aside class="vault-sidebar">
      <div class="vault-sidebar-title">Posts Tree</div>
      <div id="vault-tree" class="vault-tree"></div>
    </aside>
    <main id="vault-main" class="vault-main"></main>
  </div>
</div>

<script id="vault-payload" type="text/plain">{{ page.encrypted_payload }}</script>

<style>
  .vault-box {
    max-width: 440px;
    margin: 2.5rem auto;
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
    text-align: center;
  }
  .vault-desc {
    margin-bottom: 1.25rem;
    color: #262626;
    font-size: 0.95rem;
  }
  .vault-form {
    display: flex;
    gap: 0.5rem;
  }
  .vault-form input {
    flex: 1;
    padding: 0.6rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    font-size: 0.95rem;
    background: #ffffff;
    color: #0a0a0a;
  }
  .vault-form button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-form button:hover {
    background: #262626;
  }
  .vault-error {
    margin-top: 0.85rem;
    margin-bottom: 0;
    color: #0a0a0a;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .vault-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid #e5e5e5;
  }
  .vault-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.9rem;
    color: #737373;
  }
  .vault-crumb-btn {
    padding: 0.2rem 0.45rem;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: #525252;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-crumb-btn:hover {
    background: #f5f5f5;
    color: #0a0a0a;
  }
  .vault-crumb-current {
    font-weight: 700;
    color: #0a0a0a;
    padding: 0.2rem 0.45rem;
  }
  .vault-relock-btn {
    padding: 0.4rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    background: #ffffff;
    color: #0a0a0a;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-relock-btn:hover {
    background: #f5f5f5;
    border-color: #0a0a0a;
  }
  .vault-layout {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 1.5rem;
    align-items: start;
  }
  .vault-sidebar {
    padding: 1.1rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
  }
  .vault-sidebar-title {
    margin: 0 0 0.75rem 0;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #e5e5e5;
    font-size: 0.78rem;
    font-weight: 700;
    color: #737373;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .vault-tree-row {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    margin-bottom: 0.2rem;
  }
  .vault-toggle-btn {
    width: 22px;
    height: 26px;
    padding: 0;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: #525252;
    font-size: 0.75rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .vault-toggle-btn:hover {
    background: #e5e5e5;
    color: #0a0a0a;
  }
  .vault-toggle-spacer {
    width: 22px;
    flex-shrink: 0;
  }
  .vault-tree-post {
    flex: 1;
    padding: 0.42rem 0.55rem;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #262626;
    font-size: 0.88rem;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
  }
  .vault-tree-post:hover {
    background: #efefef;
  }
  .vault-tree-post.active {
    background: #0a0a0a;
    color: #ffffff;
    font-weight: 600;
  }
  .vault-tree-children {
    margin-left: 0.7rem;
    padding-left: 0.65rem;
    border-left: 1px solid #e5e5e5;
  }
  .vault-main {
    min-width: 0;
  }
  .vault-detail-card {
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-left: 4px solid #0a0a0a;
    border-radius: 12px;
    background: #ffffff;
  }
  .vault-card-title {
    margin: 0 0 0.45rem 0;
    font-size: 1.5rem;
    font-weight: 800;
    color: #0a0a0a;
  }
  .vault-card-meta {
    margin-bottom: 1.35rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.86rem;
    color: #737373;
  }
  .vault-tag {
    display: inline-block;
    margin-right: 0.35rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    color: #262626;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .vault-card-body pre {
    padding: 1rem;
    border-radius: 8px;
    background: #0a0a0a;
    color: #fafafa;
    overflow-x: auto;
    font-size: 0.88rem;
  }
  .vault-card-body code {
    background: #f5f5f5;
    color: #0a0a0a;
    padding: 0.12rem 0.35rem;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .vault-card-body pre code {
    background: transparent;
    color: inherit;
    padding: 0;
  }
  .vault-subposts {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid #e5e5e5;
  }
  .vault-subposts-title {
    margin: 0 0 0.85rem 0;
    font-size: 0.85rem;
    font-weight: 700;
    color: #737373;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .vault-subpost-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0.85rem 1.1rem;
    margin-bottom: 0.5rem;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    background: #fafafa;
    color: #0a0a0a;
    font-size: 0.94rem;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .vault-subpost-btn:hover {
    background: #ffffff;
    border-color: #0a0a0a;
  }
  @media (max-width: 900px) {
    .vault-layout {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
(function () {
  const lockBox = document.getElementById('vault-lock');
  const unlockedBox = document.getElementById('vault-unlocked');
  const form = document.getElementById('vault-form');
  const pwInput = document.getElementById('vault-password');
  const errorEl = document.getElementById('vault-error');
  const breadcrumbEl = document.getElementById('vault-breadcrumb');
  const treeEl = document.getElementById('vault-tree');
  const mainEl = document.getElementById('vault-main');
  const relockBtn = document.getElementById('vault-relock');
  const payloadB64 = document.getElementById('vault-payload').textContent.trim();

  let rootPosts = [];
  let selectedPostId = null;
  const expandedMap = {};

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  async function decryptPayload(password) {
    const raw = b64ToBytes(payloadB64);
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const dataWithTag = raw.slice(28);

    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const key = await window.crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decrypted = await window.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      dataWithTag
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  function initExpanded(nodes) {
    nodes.forEach(function (node) {
      if (Array.isArray(node.children) && node.children.length > 0) {
        if (expandedMap[node.id] === undefined) {
          expandedMap[node.id] = true;
        }
        initExpanded(node.children);
      }
    });
  }

  function findTrail(nodes, targetId, trail) {
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      const nextTrail = trail.concat([node]);
      if (node.id === targetId) return nextTrail;
      if (Array.isArray(node.children) && node.children.length > 0) {
        const found = findTrail(node.children, targetId, nextTrail);
        if (found) return found;
      }
    }
    return null;
  }

  function renderTreeNodes(nodes, container) {
    nodes.forEach(function (node) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const isOpen = !!expandedMap[node.id];

      const row = document.createElement('div');
      row.className = 'vault-tree-row';

      if (hasChildren) {
        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'vault-toggle-btn';
        toggleBtn.textContent = isOpen ? '▾' : '▸';
        toggleBtn.addEventListener('click', function () {
          expandedMap[node.id] = !expandedMap[node.id];
          renderTree();
        });
        row.appendChild(toggleBtn);
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'vault-toggle-spacer';
        row.appendChild(spacer);
      }

      const postBtn = document.createElement('button');
      postBtn.type = 'button';
      postBtn.className = 'vault-tree-post' + (node.id === selectedPostId ? ' active' : '');
      postBtn.textContent = '📄 ' + node.title;
      postBtn.addEventListener('click', function () {
        selectedPostId = node.id;
        render();
      });
      row.appendChild(postBtn);
      container.appendChild(row);

      if (hasChildren && isOpen) {
        const childWrap = document.createElement('div');
        childWrap.className = 'vault-tree-children';
        renderTreeNodes(node.children, childWrap);
        container.appendChild(childWrap);
      }
    });
  }

  function renderTree() {
    treeEl.innerHTML = '';
    renderTreeNodes(rootPosts, treeEl);
  }

  function renderBreadcrumb(trail) {
    breadcrumbEl.innerHTML = '';
    const rootSpan = document.createElement('span');
    rootSpan.className = 'vault-crumb-current';
    rootSpan.textContent = '🔓 Vault';
    breadcrumbEl.appendChild(rootSpan);

    if (!trail || !trail.length) return;

    trail.forEach(function (node, idx) {
      const sep = document.createElement('span');
      sep.textContent = '/';
      breadcrumbEl.appendChild(sep);

      if (idx === trail.length - 1) {
        const cur = document.createElement('span');
        cur.className = 'vault-crumb-current';
        cur.textContent = node.title;
        breadcrumbEl.appendChild(cur);
      } else {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vault-crumb-btn';
        btn.textContent = node.title;
        btn.addEventListener('click', function () {
          selectedPostId = node.id;
          render();
        });
        breadcrumbEl.appendChild(btn);
      }
    });
  }

  function renderMain(post) {
    mainEl.innerHTML = '';
    if (!post) return;

    const card = document.createElement('section');
    card.className = 'vault-detail-card';

    const title = document.createElement('h2');
    title.className = 'vault-card-title';
    title.textContent = post.title;
    card.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'vault-card-meta';
    const dateSpan = document.createElement('span');
    dateSpan.textContent = (post.date || '') + ' ';
    meta.appendChild(dateSpan);

    if (Array.isArray(post.tags)) {
      post.tags.forEach(function (tag) {
        const span = document.createElement('span');
        span.className = 'vault-tag';
        span.textContent = '#' + tag;
        meta.appendChild(span);
      });
    }
    card.appendChild(meta);

    const body = document.createElement('div');
    body.className = 'vault-card-body';
    body.innerHTML = post.content || '';
    card.appendChild(body);

    if (Array.isArray(post.children) && post.children.length > 0) {
      const subWrap = document.createElement('div');
      subWrap.className = 'vault-subposts';

      const subTitle = document.createElement('div');
      subTitle.className = 'vault-subposts-title';
      subTitle.textContent = '하위 게시물 (' + post.children.length + ')';
      subWrap.appendChild(subTitle);

      post.children.forEach(function (child) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vault-subpost-btn';
        btn.innerHTML = '<span>📄 ' + child.title + '</span><span>→</span>';
        btn.addEventListener('click', function () {
          expandedMap[post.id] = true;
          selectedPostId = child.id;
          render();
        });
        subWrap.appendChild(btn);
      });

      card.appendChild(subWrap);
    }

    mainEl.appendChild(card);
  }

  function render() {
    let trail = findTrail(rootPosts, selectedPostId, []);
    if (!trail && rootPosts.length > 0) {
      selectedPostId = rootPosts[0].id;
      trail = [rootPosts[0]];
    }
    const currentPost = trail ? trail[trail.length - 1] : null;
    renderBreadcrumb(trail);
    renderTree();
    renderMain(currentPost);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    try {
      rootPosts = await decryptPayload(pwInput.value);
      initExpanded(rootPosts);
      selectedPostId = rootPosts.length ? rootPosts[0].id : null;
      render();
      pwInput.value = '';
      lockBox.hidden = true;
      unlockedBox.hidden = false;
    } catch (err) {
      errorEl.hidden = false;
      pwInput.select();
    }
  });

  relockBtn.addEventListener('click', function () {
    rootPosts = [];
    selectedPostId = null;
    breadcrumbEl.innerHTML = '';
    treeEl.innerHTML = '';
    mainEl.innerHTML = '';
    unlockedBox.hidden = true;
    lockBox.hidden = false;
    pwInput.value = '';
    pwInput.focus();
  });
})();
</script>
