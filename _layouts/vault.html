---
layout: default
---

<div class="page-banner">
<h1 class="page-banner-title">{{ page.title | escape }}</h1>
<p class="page-banner-desc">암호화된 비공개 메모 &amp; 자격증 정리 공간</p>
</div>

<div id="vault-lock" class="vault-box">
  <p class="vault-desc">🔒 이 공간의 게시물은 암호화되어 있습니다. 비밀번호를 입력해 주세요.</p>
  <form id="vault-form" class="vault-form">
    <input
      type="password"
      id="vault-password"
      placeholder="비밀번호 입력"
      autocomplete="current-password"
      required
    />
    <button type="submit" id="vault-submit">잠금 해제</button>
  </form>
  <p id="vault-error" class="vault-error" hidden>비밀번호가 올바르지 않습니다.</p>
</div>

<div id="vault-unlocked" hidden>
  <div class="vault-toolbar">
    <div id="vault-breadcrumb" class="vault-breadcrumb"></div>
    <button type="button" id="vault-relock" class="vault-relock-btn">다시 잠그기</button>
  </div>
  <div class="vault-layout">
    <aside class="vault-sidebar">
      <div class="vault-sidebar-title">Explorer</div>
      <div id="vault-tree" class="vault-tree"></div>
    </aside>
    <main id="vault-main" class="vault-main"></main>
  </div>
</div>

<script id="vault-payload" type="text/plain">{{ page.encrypted_payload }}</script>

<style>
  .vault-box {
    max-width: 440px;
    margin: 2.5rem auto;
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
    text-align: center;
  }
  .vault-desc {
    margin-bottom: 1.25rem;
    color: #262626;
    font-size: 0.95rem;
  }
  .vault-form {
    display: flex;
    gap: 0.5rem;
  }
  .vault-form input {
    flex: 1;
    padding: 0.6rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    font-size: 0.95rem;
    background: #ffffff;
    color: #0a0a0a;
  }
  .vault-form button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-form button:hover {
    background: #262626;
  }
  .vault-error {
    margin-top: 0.85rem;
    margin-bottom: 0;
    color: #0a0a0a;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .vault-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid #e5e5e5;
  }
  .vault-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    color: #737373;
  }
  .vault-crumb-current {
    font-weight: 700;
    color: #0a0a0a;
  }
  .vault-relock-btn {
    padding: 0.4rem 0.85rem;
    border: 1px solid #d4d4d4;
    border-radius: 8px;
    background: #ffffff;
    color: #0a0a0a;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .vault-relock-btn:hover {
    background: #f5f5f5;
    border-color: #0a0a0a;
  }
  .vault-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.5rem;
    align-items: start;
  }
  .vault-sidebar {
    padding: 1.1rem;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
  }
  .vault-sidebar-title {
    margin: 0 0 0.75rem 0;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #e5e5e5;
    font-size: 0.78rem;
    font-weight: 700;
    color: #737373;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .vault-tree-children {
    margin-left: 0.85rem;
    padding-left: 0.65rem;
    border-left: 1px solid #e5e5e5;
  }
  .vault-tree-folder,
  .vault-tree-file {
    display: flex;
    align-items: flex-start;
    gap: 0.45rem;
    width: 100%;
    padding: 0.42rem 0.55rem;
    margin-bottom: 0.2rem;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #262626;
    font-size: 0.88rem;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
  }
  .vault-tree-folder {
    font-weight: 700;
    color: #0a0a0a;
  }
  .vault-tree-folder:hover,
  .vault-tree-file:hover {
    background: #efefef;
  }
  .vault-tree-file.active {
    background: #0a0a0a;
    color: #ffffff;
    font-weight: 600;
  }
  .vault-main {
    min-width: 0;
  }
  .vault-detail-card {
    padding: 2rem;
    border: 1px solid #e5e5e5;
    border-left: 4px solid #0a0a0a;
    border-radius: 12px;
    background: #ffffff;
  }
  .vault-card-path {
    display: inline-block;
    margin-bottom: 0.65rem;
    padding: 0.2rem 0.65rem;
    border-radius: 999px;
    background: #0a0a0a;
    color: #ffffff;
    font-size: 0.76rem;
    font-weight: 600;
  }
  .vault-card-title {
    margin: 0 0 0.45rem 0;
    font-size: 1.5rem;
    font-weight: 800;
    color: #0a0a0a;
  }
  .vault-card-meta {
    margin-bottom: 1.35rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.86rem;
    color: #737373;
  }
  .vault-tag {
    display: inline-block;
    margin-right: 0.35rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    color: #262626;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .vault-card-body pre {
    padding: 1rem;
    border-radius: 8px;
    background: #0a0a0a;
    color: #fafafa;
    overflow-x: auto;
    font-size: 0.88rem;
  }
  .vault-card-body code {
    background: #f5f5f5;
    color: #0a0a0a;
    padding: 0.12rem 0.35rem;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .vault-card-body pre code {
    background: transparent;
    color: inherit;
    padding: 0;
  }
  @media (max-width: 900px) {
    .vault-layout {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
(function () {
  const lockBox = document.getElementById('vault-lock');
  const unlockedBox = document.getElementById('vault-unlocked');
  const form = document.getElementById('vault-form');
  const pwInput = document.getElementById('vault-password');
  const errorEl = document.getElementById('vault-error');
  const breadcrumbEl = document.getElementById('vault-breadcrumb');
  const treeEl = document.getElementById('vault-tree');
  const mainEl = document.getElementById('vault-main');
  const relockBtn = document.getElementById('vault-relock');
  const payloadB64 = document.getElementById('vault-payload').textContent.trim();

  let allPosts = [];
  let selectedPostId = null;
  const openFolders = {};

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  async function decryptPayload(password) {
    const raw = b64ToBytes(payloadB64);
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const dataWithTag = raw.slice(28);

    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const key = await window.crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decrypted = await window.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      dataWithTag
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  function buildTree(posts) {
    const root = { folders: {}, folderOrder: [], posts: [] };
    posts.forEach(function (post) {
      const segments = Array.isArray(post.path)
        ? post.path
        : (post.category ? [post.category] : []);
      let node = root;
      let prefix = '';
      segments.forEach(function (seg) {
        prefix = prefix ? prefix + '/' + seg : seg;
        if (!node.folders[seg]) {
          node.folders[seg] = { name: seg, key: prefix, folders: {}, folderOrder: [], posts: [] };
          node.folderOrder.push(seg);
          if (openFolders[prefix] === undefined) {
            openFolders[prefix] = true;
          }
        }
        node = node.folders[seg];
      });
      node.posts.push(post);
    });
    return root;
  }

  function renderTreeNode(node, container) {
    node.folderOrder.forEach(function (folderName) {
      const folder = node.folders[folderName];
      const isOpen = !!openFolders[folder.key];

      const folderBtn = document.createElement('button');
      folderBtn.type = 'button';
      folderBtn.className = 'vault-tree-folder';
      folderBtn.textContent = (isOpen ? '▾ 📁 ' : '▸ 📁 ') + folder.name;
      folderBtn.addEventListener('click', function () {
        openFolders[folder.key] = !openFolders[folder.key];
        renderTree();
      });
      container.appendChild(folderBtn);

      if (isOpen) {
        const childWrap = document.createElement('div');
        childWrap.className = 'vault-tree-children';
        renderTreeNode(folder, childWrap);
        container.appendChild(childWrap);
      }
    });

    node.posts.forEach(function (post) {
      const fileBtn = document.createElement('button');
      fileBtn.type = 'button';
      fileBtn.className = 'vault-tree-file' + (post.id === selectedPostId ? ' active' : '');
      fileBtn.textContent = '📄 ' + post.title;
      fileBtn.addEventListener('click', function () {
        selectedPostId = post.id;
        render();
      });
      container.appendChild(fileBtn);
    });
  }

  function renderTree() {
    treeEl.innerHTML = '';
    const tree = buildTree(allPosts);
    renderTreeNode(tree, treeEl);
  }

  function renderBreadcrumb(post) {
    breadcrumbEl.innerHTML = '';
    const rootSpan = document.createElement('span');
    rootSpan.className = 'vault-crumb-current';
    rootSpan.textContent = '🔓 Vault';
    breadcrumbEl.appendChild(rootSpan);

    if (!post) return;
    const segments = Array.isArray(post.path)
      ? post.path
      : (post.category ? [post.category] : []);

    segments.forEach(function (seg) {
      const sep = document.createElement('span');
      sep.textContent = '/';
      breadcrumbEl.appendChild(sep);

      const s = document.createElement('span');
      s.textContent = seg;
      breadcrumbEl.appendChild(s);
    });

    const sepLast = document.createElement('span');
    sepLast.textContent = '/';
    breadcrumbEl.appendChild(sepLast);

    const titleSpan = document.createElement('span');
    titleSpan.className = 'vault-crumb-current';
    titleSpan.textContent = post.title;
    breadcrumbEl.appendChild(titleSpan);
  }

  function renderMain(post) {
    mainEl.innerHTML = '';
    if (!post) return;

    const card = document.createElement('section');
    card.className = 'vault-detail-card';

    const segments = Array.isArray(post.path)
      ? post.path
      : (post.category ? [post.category] : []);
    if (segments.length > 0) {
      const pathBadge = document.createElement('span');
      pathBadge.className = 'vault-card-path';
      pathBadge.textContent = segments.join(' / ');
      card.appendChild(pathBadge);
    }

    const title = document.createElement('h2');
    title.className = 'vault-card-title';
    title.textContent = post.title;
    card.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'vault-card-meta';
    const dateSpan = document.createElement('span');
    dateSpan.textContent = (post.date || '') + ' ';
    meta.appendChild(dateSpan);

    if (Array.isArray(post.tags)) {
      post.tags.forEach(function (tag) {
        const span = document.createElement('span');
        span.className = 'vault-tag';
        span.textContent = '#' + tag;
        meta.appendChild(span);
      });
    }
    card.appendChild(meta);

    const body = document.createElement('div');
    body.className = 'vault-card-body';
    body.innerHTML = post.content || '';
    card.appendChild(body);

    mainEl.appendChild(card);
  }

  function render() {
    const post = allPosts.find(function (p) { return p.id === selectedPostId; }) || allPosts[0];
    if (post) selectedPostId = post.id;
    renderBreadcrumb(post);
    renderTree();
    renderMain(post);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    try {
      allPosts = await decryptPayload(pwInput.value);
      selectedPostId = allPosts.length ? allPosts[0].id : null;
      render();
      pwInput.value = '';
      lockBox.hidden = true;
      unlockedBox.hidden = false;
    } catch (err) {
      errorEl.hidden = false;
      pwInput.select();
    }
  });

  relockBtn.addEventListener('click', function () {
    allPosts = [];
    selectedPostId = null;
    breadcrumbEl.innerHTML = '';
    treeEl.innerHTML = '';
    mainEl.innerHTML = '';
    unlockedBox.hidden = true;
    lockBox.hidden = false;
    pwInput.value = '';
    pwInput.focus();
  });
})();
</script>
