---
layout: default
---

<div class="page-banner">
<h1 class="page-banner-title">{{ page.title | escape }}</h1>
<p class="page-banner-desc">암호화된 비공개 메모 &amp; 자격증 정리 공간</p>
</div>

<div id="vault-lock" class="vault-lock-wrap">
  <div class="vault-card-lock">
    <div class="vault-lock-icon-wrap">
      <span class="vault-lock-icon">🔒</span>
    </div>
    <div class="vault-lock-eyebrow">PRIVATE VAULT · ENCRYPTED</div>
    <h2 class="vault-lock-title">Access Restricted</h2>
    <p class="vault-lock-desc">
      이 공간의 게시물은 브라우저에서 직접 복호화됩니다.<br>
      잠금을 해제하려면 비밀번호를 입력해 주세요.
    </p>
    <form id="vault-form" class="vault-form">
      <input
        type="password"
        id="vault-password"
        placeholder="Enter password..."
        autocomplete="current-password"
        required
      />
      <button type="submit" id="vault-submit">Unlock →</button>
    </form>
    <p id="vault-error" class="vault-error" hidden>비밀번호가 올바르지 않습니다.</p>
    <div class="vault-lock-footer">
      <span>AES-256-GCM</span>
      <span>·</span>
      <span>PBKDF2</span>
      <span>·</span>
      <span>30m Session</span>
    </div>
  </div>
</div>

<div id="vault-unlocked" hidden>
  <div class="vault-toolbar">
    <div id="vault-breadcrumb" class="vault-breadcrumb"></div>
    <div class="vault-toolbar-actions">
      <span id="vault-session-timer" class="vault-session-timer"></span>
      <button type="button" id="vault-relock" class="vault-relock-btn">다시 잠그기</button>
    </div>
  </div>
  <div class="vault-layout">
    <aside class="vault-sidebar">
      <div class="vault-sidebar-title">Posts Tree</div>
      <div id="vault-tree" class="vault-tree"></div>
    </aside>
    <main id="vault-main" class="vault-main"></main>
  </div>
</div>

<script id="vault-payload" type="text/plain">{{ page.encrypted_payload }}</script>

<style>
  .vault-lock-wrap[hidden],

    }

</style>

<script>
(function () {
  const SESSION_KEY = 'vault_session_v1';
  const SESSION_TTL_MS = 30 * 60 * 1000;

  const lockBox = document.getElementById('vault-lock');
  const lockCard = lockBox.querySelector('.vault-card-lock');
  const unlockedBox = document.getElementById('vault-unlocked');
  const form = document.getElementById('vault-form');
  const pwInput = document.getElementById('vault-password');
  const errorEl = document.getElementById('vault-error');
  const breadcrumbEl = document.getElementById('vault-breadcrumb');
  const timerEl = document.getElementById('vault-session-timer');
  const treeEl = document.getElementById('vault-tree');
  const mainEl = document.getElementById('vault-main');
  const relockBtn = document.getElementById('vault-relock');
  const payloadB64 = document.getElementById('vault-payload').textContent.trim();
  const payloadSig = payloadB64.slice(0, 32);

  let rootPosts = [];
  let selectedPostId = null;
  let timerInterval = null;
  const expandedMap = {};

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return bytes;
  }

  async function decryptPayload(password) {
    const raw = b64ToBytes(payloadB64);
    const salt = raw.slice(0, 16);
    const iv = raw.slice(16, 28);
    const dataWithTag = raw.slice(28);

    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const key = await window.crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decrypted = await window.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      dataWithTag
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  }

  function saveSession(posts) {
    try {
      const data = {
        sig: payloadSig,
        expiresAt: Date.now() + SESSION_TTL_MS,
        posts: posts
      };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function loadSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.sig !== payloadSig || !data.expiresAt || Date.now() >= data.expiresAt) {
        sessionStorage.removeItem(SESSION_KEY);
        return null;
      }
      return data;
    } catch (e) {
      return null;
    }
  }

  function clearSession() {
    try {
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function lockVault() {
    clearSession();
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    rootPosts = [];
    selectedPostId = null;
    breadcrumbEl.innerHTML = '';
    treeEl.innerHTML = '';
    mainEl.innerHTML = '';
    timerEl.textContent = '';
    unlockedBox.hidden = true;
    lockBox.hidden = false;
    pwInput.value = '';
  }

  function startSessionTimer(expiresAt) {
    if (timerInterval) clearInterval(timerInterval);
    function update() {
      const rem = expiresAt - Date.now();
      if (rem <= 0) {
        lockVault();
        return;
      }
      const mins = Math.floor(rem / 60000);
      const secs = Math.floor((rem % 60000) / 1000);
      timerEl.textContent = '세션 ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
    }
    update();
    timerInterval = setInterval(update, 1000);
  }

  function initExpanded(nodes) {
    nodes.forEach(function (node) {
      if (Array.isArray(node.children) && node.children.length > 0) {
        if (expandedMap[node.id] === undefined) {
          expandedMap[node.id] = true;
        }
        initExpanded(node.children);
      }
    });
  }

  function findTrail(nodes, targetId, trail) {
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      const nextTrail = trail.concat([node]);
      if (node.id === targetId) return nextTrail;
      if (Array.isArray(node.children) && node.children.length > 0) {
        const found = findTrail(node.children, targetId, nextTrail);
        if (found) return found;
      }
    }
    return null;
  }

  function renderTreeNodes(nodes, container) {
    nodes.forEach(function (node) {
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const isOpen = !!expandedMap[node.id];

      const row = document.createElement('div');
      row.className = 'vault-tree-row';

      if (hasChildren) {
        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'vault-toggle-btn';
        toggleBtn.textContent = isOpen ? '▾' : '▸';
        toggleBtn.addEventListener('click', function () {
          expandedMap[node.id] = !expandedMap[node.id];
          renderTree();
        });
        row.appendChild(toggleBtn);
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'vault-toggle-spacer';
        row.appendChild(spacer);
      }

      const postBtn = document.createElement('button');
      postBtn.type = 'button';
      postBtn.className = 'vault-tree-post' + (node.id === selectedPostId ? ' active' : '');
      postBtn.textContent = '📄 ' + node.title;
      postBtn.addEventListener('click', function () {
        selectedPostId = node.id;
        render();
      });
      row.appendChild(postBtn);
      container.appendChild(row);

      if (hasChildren && isOpen) {
        const childWrap = document.createElement('div');
        childWrap.className = 'vault-tree-children';
        renderTreeNodes(node.children, childWrap);
        container.appendChild(childWrap);
      }
    });
  }

  function renderTree() {
    treeEl.innerHTML = '';
    renderTreeNodes(rootPosts, treeEl);
  }

  function renderBreadcrumb(trail) {
    breadcrumbEl.innerHTML = '';
    const rootSpan = document.createElement('span');
    rootSpan.className = 'vault-crumb-current';
    rootSpan.textContent = '🔓 Vault';
    breadcrumbEl.appendChild(rootSpan);

    if (!trail || !trail.length) return;

    trail.forEach(function (node, idx) {
      const sep = document.createElement('span');
      sep.textContent = '/';
      breadcrumbEl.appendChild(sep);

      if (idx === trail.length - 1) {
        const cur = document.createElement('span');
        cur.className = 'vault-crumb-current';
        cur.textContent = node.title;
        breadcrumbEl.appendChild(cur);
      } else {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vault-crumb-btn';
        btn.textContent = node.title;
        btn.addEventListener('click', function () {
          selectedPostId = node.id;
          render();
        });
        breadcrumbEl.appendChild(btn);
      }
    });
  }

  function renderMain(post) {
    mainEl.innerHTML = '';
    if (!post) return;

    const card = document.createElement('section');
    card.className = 'vault-detail-card';

    const title = document.createElement('h2');
    title.className = 'vault-card-title';
    title.textContent = post.title;
    card.appendChild(title);

    const meta = document.createElement('div');
    meta.className = 'vault-card-meta';
    const dateSpan = document.createElement('span');
    dateSpan.textContent = (post.date || '') + ' ';
    meta.appendChild(dateSpan);

    if (Array.isArray(post.tags)) {
      post.tags.forEach(function (tag) {
        const span = document.createElement('span');
        span.className = 'vault-tag';
        span.textContent = '#' + tag;
        meta.appendChild(span);
      });
    }
    card.appendChild(meta);

    const body = document.createElement('div');
    body.className = 'vault-card-body';
    body.innerHTML = post.content || '';
    card.appendChild(body);

    if (Array.isArray(post.children) && post.children.length > 0) {
      const subWrap = document.createElement('div');
      subWrap.className = 'vault-subposts';

      const subTitle = document.createElement('div');
      subTitle.className = 'vault-subposts-title';
      subTitle.textContent = '하위 게시물 (' + post.children.length + ')';
      subWrap.appendChild(subTitle);

      post.children.forEach(function (child) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vault-subpost-btn';
        btn.innerHTML = '<span>📄 ' + child.title + '</span><span>→</span>';
        btn.addEventListener('click', function () {
          expandedMap[post.id] = true;
          selectedPostId = child.id;
          render();
        });
        subWrap.appendChild(btn);
      });

      card.appendChild(subWrap);
    }

    mainEl.appendChild(card);
  }

  function render() {
    let trail = findTrail(rootPosts, selectedPostId, []);
    if (!trail && rootPosts.length > 0) {
      selectedPostId = rootPosts[0].id;
      trail = [rootPosts[0]];
    }
    const currentPost = trail ? trail[trail.length - 1] : null;
    renderBreadcrumb(trail);
    renderTree();
    renderMain(currentPost);
  }

  function openVault(posts, expiresAt) {
    rootPosts = posts;
    initExpanded(rootPosts);
    selectedPostId = rootPosts.length ? rootPosts[0].id : null;
    render();
    startSessionTimer(expiresAt);
    pwInput.value = '';
    lockBox.hidden = true;
    unlockedBox.hidden = false;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errorEl.hidden = true;
    lockCard.classList.remove('shake');
    try {
      const posts = await decryptPayload(pwInput.value);
      saveSession(posts);
      openVault(posts, Date.now() + SESSION_TTL_MS);
    } catch (err) {
      errorEl.hidden = false;
      void lockCard.offsetWidth;
      lockCard.classList.add('shake');
      pwInput.select();
    }
  });

  relockBtn.addEventListener('click', function () {
    lockVault();
    pwInput.focus();
  });

  const existing = loadSession();
  if (existing) {
    openVault(existing.posts, existing.expiresAt);
  }
})();
</script>
