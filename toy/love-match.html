<div class="page-banner">
  <div class="badge-list" style="margin-top: 0; margin-bottom: 0.75rem;">
    <span class="skill-pill">Toy · Hash Match</span>
  </div>
  <h1 class="page-banner-title">연애 궁합 측정기</h1>
  <p class="page-banner-desc">연애등급 측정기에서 발급받은 두 사람의 32자리 해시값(HASH)을 입력하면, 두 코드의 궁합 점수와 세부 케미를 계산해 줍니다. <a href="{{ '/love-tier-meter/' | relative_url }}" style="font-weight: 700; text-decoration: underline;">해시값 발급받기 →</a></p>
</div>

<div class="lm-container">
  <section class="lm-card">
    <div class="lm-inputs-grid">
      <div class="lm-field">
        <label class="lm-label" for="hash-a">
          <span class="lm-tag">PERSON A</span> 첫 번째 해시값
        </label>
        <input

          type="text"
          class="lm-input"

          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="lm-vs-badge" aria-hidden="true">+</div>
      <div class="lm-field">
        <label class="lm-label" for="hash-b">
          <span class="lm-tag">PERSON B</span> 두 번째 해시값
        </label>
        <input
          id="hash-b"
          type="text"
          class="lm-input"
          placeholder="32자리 해시값 (예: 3C91D0E4...)"
          autocomplete="off"
          spellcheck="false"

      </div>
    </div>
    <div class="lm-actions">
      <button type="button" id="lm-calc-btn" class="lm-btn lm-btn-primary">궁합 점수 측정하기</button>

      <button type="button" id="lm-swap-btn" class="lm-btn lm-btn-ghost">순서 바꾸기</button>
      <button type="button" id="lm-clear-btn" class="lm-btn lm-btn-ghost">초기화</button>

      </div>
    </div>

    <div class="lm-progress-track" aria-hidden="true">
      <div id="lm-progress-fill" class="lm-progress-fill" style="width: 0%;"></div>
    </div>

    <p id="lm-summary" class="lm-summary"></p>

    <div class="lm-metrics-grid">

        <div class="lm-metric-top">
          <span>가치관 싱크로율</span>
          <strong id="lm-m1-val">0%</strong>

        <div class="lm-mini-track"><div id="lm-m1-bar" class="lm-mini-fill"></div></div>

      <div class="lm-metric-item">

          <strong id="lm-m2-val">0%</strong>

      <div class="lm-metric-item">

      <div class="lm-metric-item">

        <button type="button" id="lm-copy-text-btn" class="lm-btn lm-btn-secondary">요약 텍스트 복사</button>

<script>
(function () {
  const hashAInput = document.getElementById('hash-a');
  const hashBInput = document.getElementById('hash-b');
  const calcBtn = document.getElementById('lm-calc-btn');
  const sampleBtn = document.getElementById('lm-sample-btn');
  const swapBtn = document.getElementById('lm-swap-btn');
  const clearBtn = document.getElementById('lm-clear-btn');
  const errorEl = document.getElementById('lm-error');
  const resultEl = document.getElementById('lm-result');
  const gradeTitleEl = document.getElementById('lm-grade-title');
  const scoreValueEl = document.getElementById('lm-score-value');
  const progressFillEl = document.getElementById('lm-progress-fill');
  const summaryEl = document.getElementById('lm-summary');
  const pairDigestEl = document.getElementById('lm-pair-digest');
  const copyLinkBtn = document.getElementById('lm-copy-link-btn');
  const copyTextBtn = document.getElementById('lm-copy-text-btn');
  const copyToastEl = document.getElementById('lm-copy-toast');

  const metricEls = [
    { val: document.getElementById('lm-m1-val'), bar: document.getElementById('lm-m1-bar') },
    { val: document.getElementById('lm-m2-val'), bar: document.getElementById('lm-m2-bar') },
    { val: document.getElementById('lm-m3-val'), bar: document.getElementById('lm-m3-bar') },
    { val: document.getElementById('lm-m4-val'), bar: document.getElementById('lm-m4-bar') }
  ];

  let lastReport = null;

  function normalizeHash(raw) {
    return raw.trim().toUpperCase();
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
  }

  function clearError() {
    errorEl.hidden = true;
    errorEl.textContent = '';
  }

  function fnv1a32(str, seed) {
    let h = (0x811c9dc5 ^ (seed || 0)) >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  async function computePairBytes(a, b) {
    const pair = [a, b].sort();
    const canonical = pair[0] + '::' + pair[1];

    if (window.crypto && window.crypto.subtle) {
      const encoded = new TextEncoder().encode(canonical);
      const buf = await window.crypto.subtle.digest('SHA-256', encoded);
      return Array.from(new Uint8Array(buf));
    }

    const bytes = [];
    for (let i = 0; i < 8; i++) {
      const h = fnv1a32(canonical, i * 0x9e3779b9);
      bytes.push((h >>> 24) & 0xff, (h >>> 16) & 0xff, (h >>> 8) & 0xff, h & 0xff);
    }
    return bytes;
  }

  function toHex(bytes) {
    return bytes.map(function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  function getGradeInfo(score, isSameHash) {
    if (isSameHash) {
      return {
        title: 'S+ · 거울 같은 자기 자신',
        summary: '두 해시값이 완전히 같습니다! 세상에서 가장 나를 잘 이해하는 100% 데칼코마니 조합이네요.'
      };
    }
    if (score >= 90) {
      return {
        title: 'S등급 · 천생연분 시너지',
        summary: '해시 비트 단위까지 놀라울 정도로 잘 맞물리는 조합입니다. 말하지 않아도 통하는 포인트가 많아 오래 함께할수록 더 단단해지는 궁합이에요.'
      };
    }
    if (score >= 75) {
      return {
        title: 'A등급 · 설렘과 안정의 황금 밸런스',
        summary: '서로의 다른 점이 오히려 매력으로 작용하는 이상적인 궁합입니다. 가끔 티격태격해도 금방 웃으며 풀 수 있는 건강한 관계예요.'
      };
    }
    if (score >= 60) {
      return {
        title: 'B등급 · 맞춰갈수록 빛나는 케미',
        summary: '무난하고 편안한 흐름을 가진 궁합입니다. 서로의 취향과 소통 방식을 조금만 맞춰가면 기대 이상의 시너지를 낼 수 있어요.'
      };
    }
    if (score >= 40) {
      return {
        title: 'C등급 · 반전 매력이 필요한 조합',
        summary: '서로 다른 주파수를 가지고 있어 초반엔 낯설 수 있습니다. 하지만 다름을 인정하고 대화를 자주 나누면 의외의 케미가 터질 수 있는 사이예요.'
      };
    }
    return {
      title: 'D등급 · 극과 극의 모험가들',
      summary: '정반대의 성향이 부딪히는 짜릿한 조합입니다. 평범한 연애보다 예측 불가한 에피소드가 많을 타입이니 서로에 대한 배려가 핵심이에요.'
    };
  }

  async function evaluate() {
    clearError();
    const a = normalizeHash(hashAInput.value);
    const b = normalizeHash(hashBInput.value);

    if (!a || !b) {
      showError('두 사람의 해시값을 모두 입력해 주세요.');
      return;
    }

    const isSameHash = a === b;
    const bytes = await computePairBytes(a, b);
    const hex = toHex(bytes);

    let m1, m2, m3, m4, total;
    if (isSameHash) {
      m1 = m2 = m3 = m4 = 100;
      total = 100;
    } else {
      m1 = 35 + (((bytes[0] << 8) | bytes[1]) % 66);
      m2 = 35 + (((bytes[2] << 8) | bytes[3]) % 66);
      m3 = 35 + (((bytes[4] << 8) | bytes[5]) % 66);
      m4 = 35 + (((bytes[6] << 8) | bytes[7]) % 66);
      const rawWeighted = Math.round((m1 * 0.28) + (m2 * 0.24) + (m3 * 0.24) + (m4 * 0.24));
      const jitter = (bytes[8] % 7) - 3;
      total = Math.max(15, Math.min(99, rawWeighted + jitter));
    }

    const grade = getGradeInfo(total, isSameHash);
    gradeTitleEl.textContent = grade.title;
    scoreValueEl.textContent = String(total);
    progressFillEl.style.width = total + '%';
    summaryEl.textContent = grade.summary;
    pairDigestEl.textContent = hex.slice(0, 12);

    const metrics = [m1, m2, m3, m4];
    metrics.forEach(function (val, idx) {
      metricEls[idx].val.textContent = val + '%';
      metricEls[idx].bar.style.width = val + '%';
    });

    lastReport = {
      a: a,
      b: b,
      total: total,
      grade: grade.title,
      metrics: metrics,
      digest: hex.slice(0, 12)
    };

    resultEl.hidden = false;
    copyToastEl.hidden = true;
  }

  function showToast(msg) {
    copyToastEl.textContent = msg;
    copyToastEl.hidden = false;
  }

  calcBtn.addEventListener('click', evaluate);

  [hashAInput, hashBInput].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') evaluate();
    });
  });

  sampleBtn.addEventListener('click', function () {
    hashAInput.value = '8F4E2A9C1B7D30564A21E908C7F13B24';
    hashBInput.value = '3C91D0E4A5F28B1790D24E6A18C3F509';
    evaluate();
  });

  swapBtn.addEventListener('click', function () {
    const temp = hashAInput.value;
    hashAInput.value = hashBInput.value;
    hashBInput.value = temp;
    if (hashAInput.value.trim() && hashBInput.value.trim()) {
      evaluate();
    }
  });

  clearBtn.addEventListener('click', function () {
    hashAInput.value = '';
    hashBInput.value = '';
    clearError();
    resultEl.hidden = true;
    lastReport = null;
  });

  copyLinkBtn.addEventListener('click', function () {
    if (!lastReport) return;
    const url = new URL(window.location.href);
    url.searchParams.set('a', lastReport.a);
    url.searchParams.set('b', lastReport.b);
    navigator.clipboard.writeText(url.toString()).then(function () {
      showToast('결과 링크가 클립보드에 복사되었습니다.');
    }).catch(function () {
      showToast('클립보드 복사에 실패했습니다.');
    });
  });

  copyTextBtn.addEventListener('click', function () {
    if (!lastReport) return;
    const text = [
      '[연애 궁합 측정기 결과]',
      '궁합 점수: ' + lastReport.total + ' / 100 (' + lastReport.grade + ')',
      '가치관 ' + lastReport.metrics[0] + '% · 케미 ' + lastReport.metrics[1] + '% · 소통 ' + lastReport.metrics[2] + '% · 신뢰 ' + lastReport.metrics[3] + '%',
      'Pair Hash: ' + lastReport.digest
    ].join('\n');
    navigator.clipboard.writeText(text).then(function () {
      showToast('요약 텍스트가 클립보드에 복사되었습니다.');
    }).catch(function () {
      showToast('클립보드 복사에 실패했습니다.');
    });
  });

  const params = new URLSearchParams(window.location.search);
  const initA = params.get('a');
  const initB = params.get('b');
  if (initA && initB) {
    hashAInput.value = initA;
    hashBInput.value = initB;
    evaluate();
  }
})();
</script>
